apiVersion: v1
kind: ConfigMap
metadata:
  name: bwrap-e2e-isolation-v1
  namespace: opensandbox
  labels:
    app: bwrap-e2e-257b5f39
immutable: true
data:
  isolation.toml: |
    upper_root = "/var/lib/execd/isolation"
    allowed_writable = ["/workspace", "/mnt", "/media", "/data"]

    [hardening]
    enabled = true
    keep_capabilities = []
    allow_seccomp_user_notification = false

    [landlock]
    enabled = true
    allow_private_proc_read = false
