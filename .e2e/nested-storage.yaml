apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: bwrap-nested-e2e-v1
  namespace: opensandbox
  labels:
    app: bwrap-nested-e2e-v1
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: local-path
  resources:
    requests:
      storage: 1Gi
---
apiVersion: v1
kind: Pod
metadata:
  name: bwrap-nested-seed-v1
  namespace: opensandbox
  labels:
    app: bwrap-nested-e2e-v1
spec:
  restartPolicy: Never
  automountServiceAccountToken: false
  containers:
    - name: seed
      image: opensandbox/pool-runtime:bwrap-nested-v1
      imagePullPolicy: Never
      command: [/bin/sh, -c]
      args:
        - |
          set -eu
          mkdir -p \
            /storage/projects/parent-rw \
            /storage/projects/parent-ro/cache \
            /storage/projects/child-auto \
            /storage/projects/child-explicit
          printf 'parent-rw\n' > /storage/projects/parent-rw/base.txt
          printf 'parent-ro\n' > /storage/projects/parent-ro/base.txt
          printf 'auto-child\n' > /storage/projects/child-auto/child.txt
          printf 'explicit-child\n' > /storage/projects/child-explicit/child.txt
          chmod -R 0777 /storage/projects
      volumeMounts:
        - name: storage
          mountPath: /storage
  volumes:
    - name: storage
      persistentVolumeClaim:
        claimName: bwrap-nested-e2e-v1
