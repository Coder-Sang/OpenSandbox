apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: bwrap-recycle-e2e-v1
  namespace: opensandbox
  labels:
    app: bwrap-recycle-e2e-v1
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: local-path
  resources:
    requests:
      storage: 1Gi
---
apiVersion: v1
kind: Pod
metadata:
  name: bwrap-recycle-seed-v1
  namespace: opensandbox
  labels:
    app: bwrap-recycle-e2e-v1
spec:
  restartPolicy: Never
  automountServiceAccountToken: false
  containers:
    - name: seed
      image: opensandbox/pool-runtime:bwrap-pool-recycle-v1
      imagePullPolicy: Never
      command: [/bin/sh, -c]
      args:
        - |
          set -eu
          mkdir -p /storage/projects/project-A
          printf 'before-runtime-exit\n' > /storage/projects/project-A/persisted.txt
          chmod 0777 /storage/projects/project-A
      volumeMounts:
        - name: storage
          mountPath: /storage
  volumes:
    - name: storage
      persistentVolumeClaim:
        claimName: bwrap-recycle-e2e-v1
