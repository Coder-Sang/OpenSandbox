[package]
name = "opensandbox-rust-e2e"
version = "0.0.0"
edition = "2021"
rust-version = "1.85"
publish = false

[dependencies]
opensandbox = { path = "../../sdks/sandbox/rust" }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
opensandbox-code-interpreter = { path = "../../sdks/code-interpreter/rust" }
