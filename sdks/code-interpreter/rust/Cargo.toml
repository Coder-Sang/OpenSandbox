[package]
name = "opensandbox-code-interpreter"
version = "1.1.0"
edition = "2021"
rust-version = "1.85"
publish = false
description = "Async Rust code interpreter SDK for OpenSandbox"
license = "Apache-2.0"
repository = "https://github.com/opensandbox-group/OpenSandbox"
readme = "README.md"

[dependencies]
opensandbox = { version = "1.1.0", path = "../../sandbox/rust" }
tokio = { version = "1", features = ["time", "rt", "macros"] }

[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "net", "io-util"] }

[lints.rust]
unsafe_code = "forbid"
