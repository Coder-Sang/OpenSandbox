name: SDK Tests

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    paths:
      - "cli/**"
      - "sdks/**"
      - "specs/**"

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    uses: ./.github/workflows/detect-changes.yml
    with:
      area: sdk

  cli-quality:
    name: CLI Quality And Tests
    needs: changes
    if: needs.changes.outputs.relevant == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "latest"

      - name: Install dependencies
        working-directory: cli
        run: |
          uv sync

      - name: Run ruff
        working-directory: cli
        run: |
          uv run ruff check

      - name: Run pyright
        working-directory: cli
        run: |
          uv run pyright

      - name: Run tests
        working-directory: cli
        run: |
          mkdir -p reports
          uv run pytest tests/ -v --junitxml=reports/junit.xml

      - name: Upload CLI reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cli-reports
          path: |
            cli/reports/**

  python-sdk-quality:
    name: Python SDK Quality And Tests (${{ matrix.package_name }})
    needs: changes
    if: needs.changes.outputs.relevant == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - package_name: sandbox
            package_dir: sdks/sandbox/python
            coverage_target: src/opensandbox
          - package_name: code-interpreter
            package_dir: sdks/code-interpreter/python
            coverage_target: src/code_interpreter
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "latest"

      - name: Install dependencies
        working-directory: ${{ matrix.package_dir }}
        run: |
          uv sync

      - name: Generate API
        if: matrix.package_name == 'sandbox'
        working-directory: sdks/sandbox/python
        run: |
          uv run python scripts/generate_api.py

      - name: Run ruff
        working-directory: ${{ matrix.package_dir }}
        run: |
          uv run ruff check

      - name: Run pyright
        working-directory: ${{ matrix.package_dir }}
        run: |
          uv run pyright

      - name: Run tests
        working-directory: ${{ matrix.package_dir }}
        run: |
          mkdir -p reports
          uv run pytest tests/ -v \
            --junitxml=reports/junit.xml \
            --cov=${{ matrix.coverage_target }} \
            --cov-report=term-missing \
            --cov-report=xml:reports/coverage.xml

      - name: Upload Python reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: python-${{ matrix.package_name }}-reports
          path: |
            ${{ matrix.package_dir }}/reports/**

  javascript-sdk-quality:
    name: JavaScript SDK Quality And Tests (${{ matrix.package_name }})
    needs: changes
    if: needs.changes.outputs.relevant == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - package_name: sandbox
            package_dir: sdks/sandbox/javascript
          - package_name: code-interpreter
            package_dir: sdks/code-interpreter/javascript
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.0
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "pnpm"
          cache-dependency-path: sdks/pnpm-lock.yaml

      - name: Install dependencies
        working-directory: sdks
        run: |
          pnpm install --frozen-lockfile

      - name: Build JavaScript SDK dependencies
        working-directory: sdks
        run: |
          pnpm run build:js

      - name: Run eslint
        working-directory: ${{ matrix.package_dir }}
        run: |
          pnpm run lint

      - name: Run TypeScript typecheck
        working-directory: ${{ matrix.package_dir }}
        run: |
          pnpm run typecheck

      - name: Run tests
        working-directory: ${{ matrix.package_dir }}
        run: |
          mkdir -p reports
          node --test tests/*.test.mjs > reports/test-output.txt

      - name: Upload JavaScript reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: javascript-${{ matrix.package_name }}-reports
          path: |
            ${{ matrix.package_dir }}/reports/**

  kotlin-sdk-quality:
    name: Kotlin SDK Quality And Tests
    needs: changes
    if: needs.changes.outputs.relevant == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Run quality checks and tests
        working-directory: sdks/sandbox/kotlin
        run: |
          ./gradlew spotlessCheck :sandbox:test :code-interpreter:test

      - name: Upload Kotlin reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kotlin-reports
          path: |
            sdks/sandbox/kotlin/**/build/test-results/test/**
            sdks/sandbox/kotlin/**/build/reports/tests/test/**

  csharp-sdk-quality:
    name: C# SDK Quality And Tests (${{ matrix.package_name }})
    needs: changes
    if: needs.changes.outputs.relevant == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - package_name: sandbox
            package_dir: sdks/sandbox/csharp
            solution: OpenSandbox.sln
            test_project: tests/OpenSandbox.Tests/OpenSandbox.Tests.csproj
          - package_name: code-interpreter
            package_dir: sdks/code-interpreter/csharp
            solution: OpenSandbox.CodeInterpreter.sln
            test_project: tests/OpenSandbox.CodeInterpreter.Tests/OpenSandbox.CodeInterpreter.Tests.csproj
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "10.0.x"

      - name: Build with analyzers
        working-directory: ${{ matrix.package_dir }}
        run: |
          dotnet build ${{ matrix.solution }} --configuration Release /warnaserror

      - name: Run tests with reports
        working-directory: ${{ matrix.package_dir }}
        run: |
          dotnet test ${{ matrix.test_project }} \
            --configuration Release \
            --no-build \
            --logger "trx;LogFileName=test-results.trx" \
            --results-directory TestResults \
            --collect:"XPlat Code Coverage"

      - name: Upload C# reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: csharp-${{ matrix.package_name }}-reports
          path: |
            ${{ matrix.package_dir }}/TestResults/**

  go-sdk-quality:
    name: Go SDK Quality And Tests
    needs: changes
    if: needs.changes.outputs.relevant == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: "1.20"

      - name: Check gofmt
        working-directory: sdks/sandbox/go
        run: |
          files="$(gofmt -l .)"
          if [ -n "$files" ]; then
            echo "$files"
            exit 1
          fi

      - name: Run go vet
        working-directory: sdks/sandbox/go
        run: |
          go vet ./...

      - name: Run tests with race detector
        working-directory: sdks/sandbox/go
        run: |
          mkdir -p reports
          go test -v -race -coverprofile=reports/coverage.out ./...
          go tool cover -func=reports/coverage.out

      - name: Upload Go reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: go-sdk-reports
          path: |
            sdks/sandbox/go/reports/**

  rust-sdk-quality:
    name: Rust SDK Quality And Tests (${{ matrix.toolchain }})
    needs: changes
    if: needs.changes.outputs.relevant == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        toolchain: ["1.85.1", stable]
    defaults:
      run:
        working-directory: sdks/sandbox/rust
    env:
      RUSTDOCFLAGS: -D warnings
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Rust
        run: |
          rustup toolchain install "${{ matrix.toolchain }}" --profile minimal --component rustfmt --component clippy
          rustup default "${{ matrix.toolchain }}"

      - name: Set up generator Python
        if: matrix.toolchain == '1.85.1'
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install generator dependency
        if: matrix.toolchain == '1.85.1'
        run: python -m pip install PyYAML==6.0.2

      - name: Check generated API reproducibility
        if: matrix.toolchain == '1.85.1'
        run: |
          python -m unittest discover -s scripts -p 'test_*.py'
          python scripts/generate_api.py
          git diff --exit-code -- src/api
          python scripts/generate_api.py --check

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run clippy for each feature combination
        run: |
          cargo clippy --locked --all-targets -- -D warnings
          cargo clippy --locked --all-targets --features redis -- -D warnings
          cargo clippy --locked --all-targets --features tracing -- -D warnings
          cargo clippy --locked --all-targets --all-features -- -D warnings

      - name: Run tests and doctests for each feature combination
        run: |
          cargo test --locked
          cargo test --locked --features redis
          cargo test --locked --features tracing
          cargo test --locked --all-features

      - name: Build documentation
        run: cargo doc --locked --no-deps --all-features

      - name: Check package
        run: cargo package --locked

  rust-code-interpreter-quality:
    name: Rust Code Interpreter Quality And Tests (${{ matrix.toolchain }})
    needs: changes
    if: needs.changes.outputs.relevant == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        toolchain: ["1.85.1", stable]
    defaults:
      run:
        working-directory: sdks/code-interpreter/rust
    env:
      RUSTDOCFLAGS: -D warnings
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Rust
        run: |
          rustup toolchain install "${{ matrix.toolchain }}" --profile minimal --component rustfmt --component clippy
          rustup default "${{ matrix.toolchain }}"

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run clippy
        run: cargo clippy --locked --all-targets --all-features -- -D warnings

      - name: Run tests and doctests with local core SDK
        run: cargo test --locked --all-features

      - name: Build examples with local core SDK
        run: cargo build --locked --examples --all-features

      - name: Build documentation
        run: cargo doc --locked --no-deps --all-features

      - name: Validate E2E fixtures without allocating resources
        working-directory: tests/rust
        run: |
          cargo fmt --all -- --check
          cargo clippy --locked --all-targets -- -D warnings
          cargo test --locked

      - name: Check package file list
        # The core SDK is not published yet. Registry dependency resolution and
        # package verification are covered separately once it is available.
        # Local path builds above validate the actual interpreter implementation.
        run: cargo package --locked --list

  rust-sdk-redis:
    name: Rust SDK Redis 7 And TLS Integration (${{ matrix.toolchain }})
    needs: changes
    if: needs.changes.outputs.relevant == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        toolchain: ["1.85.1", stable]
    env:
      OPENSANDBOX_RUST_TOOLCHAINS: ${{ matrix.toolchain }}
      JCODE_SCRATCH_DIR: ${{ runner.temp }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Rust
        run: |
          rustup toolchain install "${{ matrix.toolchain }}" --profile minimal
          rustup default "${{ matrix.toolchain }}"

      - name: Run dedicated Redis pool and TLS validation tests
        run: bash scripts/rust-redis-e2e.sh

      - name: Upload Redis and TLS integration logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rust-redis-tls-${{ matrix.toolchain }}-logs
          # Only diagnostic logs; never upload fixture keys, certificates or configuration.
          path: |
            ${{ runner.temp }}/opensandbox-rust-redis.*/plain-*.txt
            ${{ runner.temp }}/opensandbox-rust-redis.*/tls-pool-*.txt
            ${{ runner.temp }}/opensandbox-rust-redis.*/tls-validation-*.txt
            ${{ runner.temp }}/opensandbox-rust-redis.*/*-plain.log
            ${{ runner.temp }}/opensandbox-rust-redis.*/*-tls.log
            ${{ runner.temp }}/opensandbox-rust-redis.*/redis-version.txt
            ${{ runner.temp }}/opensandbox-rust-redis.*/image.txt
          retention-days: 5

  required:
    name: SDK CI
    if: ${{ always() && github.event_name == 'pull_request' }}
    needs:
      - changes
      - cli-quality
      - python-sdk-quality
      - javascript-sdk-quality
      - kotlin-sdk-quality
      - csharp-sdk-quality
      - go-sdk-quality
      - rust-sdk-quality
      - rust-code-interpreter-quality
      - rust-sdk-redis
    runs-on: ubuntu-latest
    steps:
      - name: Verify required jobs
        env:
          RELEVANT: ${{ needs.changes.outputs.relevant }}
          CHANGES_RESULT: ${{ needs.changes.result }}
          CLI_QUALITY_RESULT: ${{ needs.cli-quality.result }}
          PYTHON_QUALITY_RESULT: ${{ needs.python-sdk-quality.result }}
          JAVASCRIPT_RESULT: ${{ needs.javascript-sdk-quality.result }}
          KOTLIN_RESULT: ${{ needs.kotlin-sdk-quality.result }}
          CSHARP_RESULT: ${{ needs.csharp-sdk-quality.result }}
          GO_RESULT: ${{ needs.go-sdk-quality.result }}
          RUST_RESULT: ${{ needs.rust-sdk-quality.result }}
          RUST_INTERPRETER_RESULT: ${{ needs.rust-code-interpreter-quality.result }}
          RUST_REDIS_RESULT: ${{ needs.rust-sdk-redis.result }}
        run: |
          if [[ "$CHANGES_RESULT" != "success" ]]; then
            echo "Change detection failed: $CHANGES_RESULT"
            exit 1
          fi
          if [[ "$RELEVANT" == "true" ]]; then
            [[ "$CLI_QUALITY_RESULT" == "success" && "$PYTHON_QUALITY_RESULT" == "success" && "$JAVASCRIPT_RESULT" == "success" && "$KOTLIN_RESULT" == "success" && "$CSHARP_RESULT" == "success" && "$GO_RESULT" == "success" && "$RUST_RESULT" == "success" && "$RUST_INTERPRETER_RESULT" == "success" && "$RUST_REDIS_RESULT" == "success" ]]
          else
            [[ "$RELEVANT" == "false" && "$CLI_QUALITY_RESULT" == "skipped" && "$PYTHON_QUALITY_RESULT" == "skipped" && "$JAVASCRIPT_RESULT" == "skipped" && "$KOTLIN_RESULT" == "skipped" && "$CSHARP_RESULT" == "skipped" && "$GO_RESULT" == "skipped" && "$RUST_RESULT" == "skipped" && "$RUST_INTERPRETER_RESULT" == "skipped" && "$RUST_REDIS_RESULT" == "skipped" ]]
          fi
